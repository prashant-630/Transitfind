$("main").innerHTML=`<h2>Report an Item</h2><form class="panel" id="rf" style="max-width:700px" onsubmit="return false"><div class="filters">
<div><label for="rK">Report type <i>*</i></label><select id="rK">${opts(["Lost","Found"],k)}</select></div>

<label for="rPic" style="margin-top:12px">Item photo (optional)</label><input id="rPic" type="file" accept="image/*"><img id="pv" alt="Preview" style="display:none;max-height:130px;border-radius:10px;margin-top:8px">
<div class="err" id="rE"></div><button class="btn" data-a="submit">Submit Report</button></form>`}
 
function dash(){const it=D.items,mx=Math.max(1,...Object.keys(TR).map(t=>it.filter(i=>i.tr===t).length));
$("main").innerHTML=`<h2>Dashboard</h2><div class="alert"><b>Safety tip</b>Never share OTPs or bank details to “claim” an item. Collect found items only from station staff or after proof checks.</div>
<div class="stats"><div class="stat"><b>${it.length}</b><span>reports</span></div>${ST.map(s=>`<div class="stat"><b>${it.filter(i=>i.status===s).length}</b><span>${s}</span></div>`).join("")}</div>
<div class="panel"><b>Reports by transport</b>${Object.keys(TR).map(t=>{const n=it.filter(i=>i.tr===t).length;return`<div class="bar"><span>${TR[t].i} ${t}</span><i style="width:${n/mx*60}%"></i>${n}</div>`}).join("")}</div>

`}
 
function detail(id){const i=D.items.find(x=>x.id===id);if(!i)return;
$("dlgB").innerHTML=`${i.photo?`<img class="big" src="${i.photo}" alt="${esc(i.name)}">`:`<div class="bigE">${CI[i.cat]||"📦"}</div>`}

function claimForm(id){$("cf").innerHTML=`<div class="tip meta">Describe something only the owner would know (marks, contents, lock screen…). Staff verify before handover.</div>

document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,d=b.dataset;
if(a==="go"){e.preventDefault();go(d.v)}
else if(a==="theme"){const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dk?"light":"dark"}
else if(a==="tr"){F={...E,tr:d.t};go("search")}

else if(a==="claim"){const n=$("cN").value.trim(),p=$("cP").value.trim(),pr=$("cPr").value.trim();if(!n||!p||pr.length<5){$("cE").textContent="Please fill in every field.";return}
const i=D.items.find(x=>x.id===+d.id);if(D.claims.some(c=>c.item===i.id&&c.uid===me.id&&c.st==="Pending")){$("cE").textContent="You already have a pending claim for this item.";return}D.claims.push({id:uid(),item:i.id,uid:me.id,n,p,pr,st:"Pending",t:Date.now()});notify("admin",`New claim on "${i.name}" by ${n}`);notify(i.uid,`Someone submitted a claim on your report "${i.name}".`);notify(me.id,`Your claim on "${i.name}" is waiting for admin review.`);save();side();$("dlg").close();toast("Claim submitted. Admin will review it.");go(view)}
else if(a==="submit"){const g=id=>$(id).value.trim(),v={name:g("rN"),desc:g("rDe"),who:g("rW"),phone:g("rPh"),date:g("rD")};
if(!v.name||!v.desc||!v.who||!v.date||!/^[0-9+\s-]{7,15}$/.test(v.phone)){$("rE").textContent="Please fill all required fields with a valid phone number.";return}
const n={id:Date.now(),...v,status:g("rK"),tr:g("rTr"),loc:g("rLoc"),plat:g("rP"),cat:g("rC"),time:g("rT"),photo,uid:me.id};D.items.push(n);notify("admin",`New ${n.status.toLowerCase()} report: ${n.name} (${n.loc})`);D.items.filter(o=>o.uid&&o.status!==n.status&&o.status!=="Claimed"&&o.cat===n.cat&&o.tr===n.tr&&(o.loc===n.loc||Math.abs(new Date(o.date)-new Date(n.date))<=3*864e5)).forEach(o=>{notify(o.uid,`Possible match for your "${o.name}": "${n.name}" at ${n.loc}.`);notify(me.id,`Possible match for your "${n.name}": "${o.name}" at ${o.loc}.`)});save();side();F={...E};toast("Report submitted.");go("search")}
else if(a==="resetdemo"){D={items:demo(),claims:[]};save();toast("Demo data restored.");dash()}});
document.addEventListener("change",e=>{const t=e.target;
if(t.dataset.ch==="loc"){$("fLoc").innerHTML=gopts(t.value,"","All Stations")}
else if(t.dataset.ch==="rloc"){$("rLoc").innerHTML=gopts(t.value,"")}
else if(t.id==="rPic")pick(t.files[0],u=>{photo=u;const p=$("pv");p.src=u;p.style.display="block"})});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="fKw")document.querySelector("[data-a=apply]").click()});
/* ===== ACCOUNTS, NOTIFICATIONS, ADMIN ===== */
const adm=()=>me&&me.role==='admin',uid=()=>Date.now()+Math.floor(Math.random()*1000);
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' days ago'};
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'f'+(h>>>0).toString(16)}}
const setMe=u=>{me=u?{id:u.id,name:u.name,email:u.email,phone:u.phone,role:u.role}:null;try{u?localStorage.setItem('tf.me3',JSON.stringify(me)):localStorage.removeItem('tf.me3')}catch(e){}};
const mine=()=>me?D.notes.filter(n=>n.to===me.id||(adm()&&n.to==='admin')):[];
function notify(to,text){if(!to)return;D.notes.unshift({id:uid(),to,text,t:Date.now(),read:false});save()}
function side(){const n=mine().filter(x=>!x.read).length,d=$('dot');d.hidden=!n;d.textContent=n;$('acct').textContent=me?me.name.split(' ')[0]+' · Log out':'Log in'}
function authDlg(m,msg){const r=m==='register'||m==='adminreg',ar=m==='adminreg';$('dlgB').innerHTML=`<h2 style='color:var(--ink);margin:0 0 8px'>${ar?'Admin Registration':r?'Create account':m==='admin'?'Admin Login':'Public Login'}</h2>${msg?`<p class='meta'>${esc(msg)}</p>`:''}${r?`<label for='aN'>Full name</label><input id='aN' maxlength='40' autocomplete='name'><label for='aP' style='margin-top:8px'>Phone</label><input id='aP' type='tel' maxlength='15' autocomplete='tel'>`:''}<label for='aE' style='margin-top:8px'>Email</label><input id='aE' type='email' autocomplete='email'><label for='aW' style='margin-top:8px'>Password</label><input id='aW' type='password' autocomplete='${r?'new-password':'current-password'}' placeholder='At least 6 characters'>${r?`<label for='aQ' style='margin-top:8px'>Security question (used if you forget your password)</label><select id='aQ'><option>What was your first school name?</option><option>What is your favourite station?</option><option>What is your pet name?</option><option>In which town was your mother born?</option></select><input id='aA' placeholder='Your answer' maxlength='40' style='margin-top:6px'>`:''}${m==='login'||m==='admin'?`<div style='text-align:right;margin-top:6px'><button class='btn g' style='padding:4px 10px;margin:0;font-size:.82rem' data-a='forgot' data-m='${m}'>Forgot password?</button></div>`:''}${ar?`<label for='aC' style='margin-top:8px'>Admin access code</label><input id='aC' type='password' autocomplete='off'>`:''}<div class='err' id='aR'></div><button class='btn' data-a='doauth' data-m='${m}'>${r?'Register':'Log in'}</button>${m==='admin'||ar?`<button class='btn g' data-a='authsw' data-m='login'>Public login</button>${ar?`<button class='btn g' data-a='authsw' data-m='admin'>Admin login</button>`:`<button class='btn g' data-a='authsw' data-m='adminreg'>Register as admin</button>`}`:`<button class='btn g' data-a='authsw' data-m='${r?'login':'register'}'>${r?'I have an account':'New here? Register'}</button>${r?'':`<button class='btn g' data-a='authsw' data-m='admin'>Admin login</button>`}`}`;if(view==='login'){$('gf').innerHTML=$('dlgB').innerHTML;$('dlgB').innerHTML='';const ad=['admin','adminreg'].includes(m);document.querySelectorAll('.lt button').forEach(b=>b.classList.toggle('on',(b.dataset.m==='admin')===ad));return}if(!$('dlg').open)$('dlg').showModal()}
async function doAuth(m){const g=id=>$(id)?$(id).value.trim():'',e=g('aE').toLowerCase(),w=$('aW').value.trim(),er=t=>{$('aR').textContent=t};
if(!/^\S+@\S+\.\S+$/.test(e)||w.length<6)return er('Enter a valid email and a password of 6+ characters.');const h=await hash(w);
if(m==='register'||m==='adminreg'){const ar=m==='adminreg';if(ar&&await hash(g('aC'))!==D.acode)return er('Wrong admin access code.');const n=g('aN'),p=g('aP');if(n.length<2||!/^[0-9+\s-]{7,15}$/.test(p))return er('Enter your name and a valid phone number.');if(D.users.some(u=>u.email===e))return er('That email is already registered.');if(!g('aA'))return er('Please answer the security question.');const u={id:uid(),name:n,email:e,phone:p,role:ar?'admin':'user',pw:h,sq:$('aQ').value,sa:await hash(g('aA').toLowerCase()),t:Date.now()};D.users.push(u);notify('admin',(ar?'New admin registered: ':'New user registered: ')+n);save();toast('Account created.');authDlg(ar?'admin':'login','Account created. Please log in.');return}
else{const u=D.users.find(x=>x.email===e&&x.pw===h);if(!u)return er(D.users.some(x=>x.email===e)?'Wrong password. Use Forgot password if needed.':'No account found with this email. Please register first.');if(m==='admin'&&u.role!=='admin')return er('This is not an admin account.');if(m==='login'&&u.role==='admin')return er('Admin accounts must use Admin Login.');setMe(u);toast('Logged in.')}
$('dlg').close();side();go(adm()?'admin':['gate','login'].includes(view)?'home':view)}
function notes(){const l=mine();$('main').innerHTML=`<div class='cnt'><h2>Notifications</h2><button class='btn w' style='margin:0' data-a='readall'>Mark all read</button></div>${l.map(n=>`<div class='nt ${n.read?'':'un'}'><span>${esc(n.text)}</span><span class='meta'>${ago(n.t)}</span></div>`).join('')||`<div class='empty'>No notifications yet.</div>`}`}
let at='over';
function admin(){const it=D.items,pc=D.claims.filter(c=>c.st==='Pending'),gh="color:var(--onbg);border-color:rgba(255,255,255,.4)";
const T=[['over','Overview'],['claims','Claims ('+pc.length+')'],['reports','Reports'],['users','Users'],['ann','Announce']];
let h=`<h2>Admin Panel</h2><div class='tabs'>${T.map(([k,t])=>`<button class='btn ${at===k?'':'g'}' style='text-align:left;width:100%;margin:0 0 6px' data-a='atab' data-k='${k}'>${t}</button>`).join('')}</div>`;
if(at==='over')h+=`<div class='stats'>${[['Users',D.users.length],['Reports',it.length],['Pending claims',pc.length],['Claimed',it.filter(i=>i.status==='Claimed').length]].map(([t,n])=>`<div class='stat'><b>${n}</b><span>${t}</span></div>`).join('')}</div><div class='panel'><b>Latest activity</b>${D.notes.filter(n=>n.to==='admin').slice(0,8).map(n=>`<div class='meta' style='padding:6px 0;border-bottom:1px solid var(--line)'>${esc(n.text)} · ${ago(n.t)}</div>`).join('')||`<p class='meta'>Nothing yet.</p>`}</div><div class='panel' style='margin:12px 0'><b>Admin access code</b><p class='meta'>New admins need this code to register. Change it often and share it only with people you trust.</p><input id='nC' type='text' placeholder='New code (min 8 characters)' maxlength='40'><div class='err' id='nE'></div><button class='btn' data-a='setcode'>Update code</button></div><button class='btn g' style='${gh}' data-a='reset2'>Reset demo data</button>`;
if(at==='claims')h+=D.claims.slice().reverse().map(c=>{const i=it.find(x=>x.id===c.item)||{name:'(removed item)'};return`<div class='panel' style='margin-bottom:10px'><b>${esc(i.name)}</b> <span class='badge ${c.st}'>${c.st}</span><div class='meta'>By ${esc(c.n)} · ${esc(c.p)} · ${ago(c.t)}</div><p style='margin:8px 0 0'>${esc(c.pr)}</p>${c.st==='Pending'?`<button class='btn f' style='padding:7px 14px;margin:8px 8px 0 0' data-a='appr' data-id='${c.id}'>Approve</button><button class='btn l' style='padding:7px 14px;margin:8px 0 0' data-a='rej' data-id='${c.id}'>Reject</button>`:''}</div>`}).join('')||`<div class='empty'>No claims yet.</div>`;
if(at==='reports')h+=`<div class='panel tw'><table><thead><tr><th>Item</th><th>Status</th><th>Transport</th><th>Location</th><th></th></tr></thead><tbody>${it.slice().reverse().map(i=>`<tr><td>${esc(i.name)}</td><td><span class='badge ${i.status}'>${i.status}</span></td><td>${i.tr}</td><td>${esc(i.loc)}</td><td><button class='btn g' style='padding:4px 10px;margin:0' data-a='delit' data-id='${i.id}'>Delete</button></td></tr>`).join('')}</tbody></table></div>`;
if(at==='users')h+=`<div class='panel tw'><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th></th></tr></thead><tbody>${D.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.phone)}</td><td>${u.role}</td><td>${u.role==='admin'?'':`<button class='btn g' style='padding:4px 10px;margin:0' data-a='deluser' data-id='${u.id}'>Remove</button><button class='btn g' style='padding:4px 10px;margin:0 0 0 6px' data-a='resetpw' data-id='${u.id}'>Reset password</button>`}</td></tr>`).join('')}</tbody></table></div>`;
if(at==='ann')h+=`<div class='panel'><label for='anT'>New announcement (sent to all users)</label><textarea id='anT' maxlength='200'></textarea><button class='btn' data-a='post'>Post announcement</button></div>${D.ann.map(x=>`<div class='nt' style='margin-top:8px'><span>${esc(x.text)}</span><button class='btn g' style='padding:4px 10px;margin:0' data-a='delann' data-id='${x.id}'>Delete</button></div>`).join('')}`;
$('main').innerHTML=`<div class='admx'>${h}</div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,d=b.dataset,id=+d.id;
if(a==='cont')go(me?(adm()?'admin':'home'):'login');

else{c.st='Rejected';notify(c.uid,`Your claim on "${nm}" was not approved.`)}}
else if(a==='delit'){D.items=D.items.filter(x=>x.id!==id);D.claims=D.claims.filter(x=>x.item!==id)}
else if(a==='deluser')D.users=D.users.filter(x=>x.id!==id);
else if(a==='reset2'){D.items=demo();D.claims=[]}
save();side();admin()}});
function gate(){const sc=Object.values(TR).flatMap(m=>Object.entries(m.g).filter(([k])=>k!=='Other').flatMap(([k,a])=>a)).length;$('main').innerHTML=`<div class='lp'><div class='lh'><div><div class='logo' style='width:58px;height:58px;font-size:1.9rem'>🚆</div><h1>Transit<span style='color:#ffc93c'>Find</span></h1><p class='lead'>Lost something on the metro, train or bus? Search, report and claim items across Mumbai.</p><ul class='gp'><li>🔎 Search found items by station</li><li>📝 Report lost or found items</li><li>🔔 Get alerts when something matches</li></ul></div><div><div class='demo' aria-hidden='true'><div class='dsb'><span>🏠 Home</span><span>🔎 Search</span><span>📝 Report</span><span>📊 Dashboard</span><span>🔔 Alerts</span></div><div class='dmain'><div class='dc'>👛 Black Wallet · Found · CSMT Station</div><div class='dc c2'>📱 Samsung Phone · Found · Andheri</div><div class='dc c3'>🎒 Blue Backpack · Lost · Dadar Bus Stand</div><div class='dal'>🔔 Possible match found!</div></div></div><div class='track' aria-hidden='true'><span>🚆</span><span>🚌</span><span>🚇</span></div></div></div>
<div class='stats'><div class='stat'><b data-n='${sc}'>0</b><span>stations covered</span></div><div class='stat'><b data-n='3'>0</b><span>transport types</span></div><div class='stat'><b data-n='${D.items.length}'>0</b><span>items reported</span></div><div class='stat'><b data-n='${D.items.filter(i=>i.status==='Claimed').length}'>0</b><span>items returned</span></div></div>
<h2>Why TransitFind?</h2><div class='fgrid'>${[['🔎','Smart search','Filter by transport, station, category, date and keyword.'],['📝','Quick reports','Report a lost or found item with a photo in under a minute.'],['🔔','Match alerts','Get notified when a report may match yours.'],['🛡️','Verified claims','An admin checks every claim before handover.'],['🔐','Secure accounts','Register, log in and recover your password.'],['📱','Any device','Works on phones, tablets and laptops, in dark mode too.']].map(([i,t,p])=>`<div class='fc'><b>${i}</b><h3>${t}</h3><p>${p}</p></div>`).join('')}</div>
<h2>How it works</h2><div class='fgrid'>${[['1','Register','Create your free account.'],['2','Report or search','Post what you lost or found, or search the list.'],['3','Claim and collect','Submit a claim, get approval and collect your item.']].map(([i,t,p])=>`<div class='fc'><b>${i}</b><h3>${t}</h3><p>${p}</p></div>`).join('')}</div>
<div class='cbar'><button class='btn' data-a='cont'>${me?'Continue as '+esc(me.name.split(' ')[0]):'Continue'} →</button></div></div>`;
document.querySelectorAll('[data-n]').forEach(el=>{const n=+el.dataset.n,s=Math.max(1,Math.ceil(n/40));let c=0;const t=setInterval(()=>{c=Math.min(n,c+s);el.textContent=c;if(c>=n)clearInterval(t)},35)})}
function myr(){const l=D.items.filter(i=>i.uid===me.id),c=D.claims.filter(x=>x.uid===me.id);
$('main').innerHTML=`<h2>My Reports</h2>${l.map(i=>`<div class='panel' style='margin-bottom:10px'><b>${esc(i.name)}</b> <span class='badge ${i.status}'>${i.status}</span><div class='meta'>${TR[i.tr].i} ${esc(i.loc)} · ${fd(i.date)}</div><button class='btn' style='padding:6px 12px;margin:8px 6px 0 0' data-a='edit' data-id='${i.id}'>Edit</button>${i.status!=='Claimed'?`<button class='btn f' style='padding:6px 12px;margin:8px 6px 0 0' data-a='resolve' data-id='${i.id}'>Mark resolved</button>`:''}<button class='btn g' style='padding:6px 12px;margin:8px 0 0' data-a='mydel' data-id='${i.id}'>Delete</button></div>`).join('')||`<div class='empty'>You have not reported anything yet.</div>`}<h2>My Claims</h2>${c.map(x=>{const i=D.items.find(y=>y.id===x.item);return`<div class='panel' style='margin-bottom:10px'><b>${esc(i?i.name:'(removed item)')}</b> <span class='badge ${x.st}'>${x.st}</span> <span class='meta'>${ago(x.t)}</span></div>`}).join('')||`<div class='empty'>No claims yet.</div>`}`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||!me)return;const a=b.dataset.a,id=+b.dataset.id,i=D.items.find(x=>x.id===id),own=i&&(i.uid===me.id||adm());
if(a==='edit'&&own){$('dlgB').innerHTML=`<h2 style='color:var(--ink);margin:0 0 8px'>Edit report</h2><label for='eN'>Item name</label><input id='eN' maxlength='60' value='${esc(i.name)}'><label for='eP' style='margin-top:8px'>Platform / Bay</label><input id='eP' value='${esc(i.plat)}'><label for='eD' style='margin-top:8px'>Description</label><textarea id='eD' maxlength='300'>${esc(i.desc)}</textarea><div class='err' id='eE'></div><button class='btn' data-a='saveedit' data-id='${i.id}'>Save</button><button class='btn g' data-a='close'>Cancel</button>`;$('dlg').showModal()}
else if(a==='saveedit'&&own){const n=$('eN').value.trim(),dd=$('eD').value.trim();if(!n||!dd){$('eE').textContent='Name and description are required.';return}i.name=n;i.plat=$('eP').value.trim();i.desc=dd;save();$('dlg').close();toast('Report updated.');go(view)}
else if(a==='resolve'&&own){i.status='Claimed';save();toast('Marked as resolved.');go(view)}
else if(a==='mydel'&&own){D.items=D.items.filter(x=>x.id!==id);D.claims=D.claims.filter(x=>x.item!==id);save();toast('Report deleted.');go(view)}
else if(adm()){if(a==='post'){const t=$('anT').value.trim();if(!t)return;D.ann.unshift({id:uid(),text:t,t:Date.now()});D.users.filter(u=>u.role!=='admin').forEach(u=>notify(u.id,'📢 '+t));save();toast('Announcement posted.');admin()}
else if(a==='setcode'){const c=$('nC').value.trim();if(c.length<8){$('nE').textContent='Use at least 8 characters.';return}hash(c).then(h=>{D.acode=h;save();toast('Access code updated.');admin()})}
else if(a==='delann'){D.ann=D.ann.filter(x=>x.id!==id);save();admin()}
else if(a==='resetpw'){const u=D.users.find(x=>x.id===id);if(!u)return;const tp=Math.random().toString(36).slice(2,10);hash(tp).then(h=>{u.pw=h;save();notify(u.id,'An admin reset your password. Log in with the temporary password you were given.');$('dlgB').innerHTML=`<h2 style='color:var(--ink);margin:0 0 8px'>Temporary password</h2><p>Give this to ${esc(u.name)}: <b>${tp}</b></p><button class='btn' data-a='close'>Done</button>`;$('dlg').showModal()})}}});
function lgn(){$('main').innerHTML=`<div class='lw'><button class='btn g' style='color:var(--onbg);border-color:rgba(255,255,255,.4);margin:0 0 12px' data-a='go' data-v='gate'>← Back</button><div class='panel'><div class='lt'><button data-a='authsw' data-m='login' class='on'>👤 Public</button><button data-a='authsw' data-m='admin'>🛡️ Admin</button></div><div id='gf'></div></div><p class='lead' style='font-size:.85rem;margin-top:10px'>New here? Choose Public, then Register. Only registered users can log in.</p><button class='btn g' style='color:var(--onbg);border-color:rgba(255,255,255,.4);padding:6px 12px;font-size:.82rem' data-a='wipe'>Trouble logging in? Reset app data</button></div>`;authDlg('login')}
function forgot(m,st,email){const ad=m==='admin',u=email?D.users.find(x=>x.email===email):null;
let h=`<h2 style='color:var(--ink);margin:0 0 8px'>Forgot password</h2>`;
if(!st)h+=`<p class='meta'>Enter the email you registered with.</p><label for='fE'>Email</label><input id='fE' type='email' autocomplete='email'><div class='err' id='fR'></div><button class='btn' data-a='fnext' data-m='${m}'>Next</button>`;
else h+=(ad?`<p class='meta'>Admins reset their password with the Admin access code.</p><label for='fA'>Admin access code</label><input id='fA' type='password' autocomplete='off'>`:`<p class='meta'>Answer your security question:</p><p><b>${esc(u.sq)}</b></p><label for='fA'>Your answer</label><input id='fA' autocomplete='off'>`)+`<label for='fP' style='margin-top:8px'>New password</label><input id='fP' type='password' autocomplete='new-password' placeholder='At least 6 characters'><div class='err' id='fR'></div><button class='btn' data-a='freset' data-m='${m}' data-e='${esc(email)}'>Reset password</button>`;
h+=`<button class='btn g' data-a='authsw' data-m='${m}'>Back to login</button>`;
$('dlgB').innerHTML=h;if(view==='login'){$('gf').innerHTML=h;$('dlgB').innerHTML=''}else if(!$('dlg').open)$('dlg').showModal()}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,m=b.dataset.m;
if(a==='wipe'){D={items:demo(),claims:[],users:[],notes:[],ann:[]};setMe(null);await seed();save();toast('App data reset. Admin: admin@transitfind.in / Admin@123');authDlg('login')}
else if(a==='forgot')forgot(m==='admin'?'admin':'login');
else if(a==='fnext'){const em=$('fE').value.trim().toLowerCase(),u=D.users.find(x=>x.email===em),er=t=>{$('fR').textContent=t};
if(!u||(m==='admin')!==(u.role==='admin'))return er('No account found with that email in this section.');
if(m!=='admin'&&!u.sq)return er('This account has no security question. Ask an admin to reset your password.');forgot(m,1,em)}
else if(a==='freset'){const u=D.users.find(x=>x.email===b.dataset.e),er=t=>{$('fR').textContent=t},np=$('fP').value.trim(),ans=$('fA').value.trim();
if(!u)return;if(np.length<6)return er('New password must be 6+ characters.');
const ok=m==='admin'?await hash(ans)===D.acode:await hash(ans.toLowerCase())===u.sa;
if(!ok)return er(m==='admin'?'Wrong admin access code.':'Wrong answer.');
u.pw=await hash(np);save();toast('Password updated. Please log in.');authDlg(m==='admin'?'admin':'login','Password updated. Please log in.')}});
async function seed(){if(!D.acode){D.acode=await hash('TRANSIT-ADMIN-2026');save()}if(!D.users.some(u=>u.role==='admin')){D.users.push({id:1,name:'Admin',email:'admin@transitfind.in',phone:'0000000000',role:'admin',pw:await hash('Admin@123'),t:Date.now()});save()}}
seed().then(()=>{side();go('gate')});
</script>
